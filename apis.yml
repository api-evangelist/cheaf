aid: cheaf
name: Cheaf
description: >-
  Cheaf is a mobile food-rescue marketplace that connects supermarkets,
  restaurants, bakeries, and food retailers holding surplus inventory with
  consumers who buy it as discounted "surprise packages" at pickup, cutting food
  waste while helping merchants recover value on stock that would otherwise be
  thrown away. Founded in Mexico in 2020, the consumer app operates across
  Mexico, Chile, and Argentina, has more than 3.5 million users, and reports
  millions of kilograms of food rescued and greenhouse-gas emissions avoided.
  Businesses list surplus through a merchant onboarding portal and pay a
  commission on sales; consumers browse and reserve packages through the mobile
  app. This API Evangelist profile tracks Cheaf's public web and developer
  surface; Cheaf is a consumer/merchant mobile platform and does not currently
  publish a public developer API, SDKs, or documentation.
